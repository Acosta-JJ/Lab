# Applied to every node at `talosctl gen config` time.
cluster:
  # All three nodes are control plane and worker at the same time.
  allowSchedulingOnControlPlanes: true
  etcd:
    extraArgs:
      # etcd runs on SD cards, whose fsync latency is poor enough that the
      # defaults (100ms / 1000ms) trigger spurious leader elections, which in
      # turn make the VIP flap. Slower failover detection is the trade-off.
      heartbeat-interval: "500"
      election-timeout: "5000"

machine:
  install:
    disk: /dev/mmcblk0
  kubelet:
    extraMounts:
      # The kubelet runs in a container and cannot see this host path otherwise.
      # rshared propagation is required: Longhorn creates mounts that must
      # propagate back to the host.
      #
      # /var/mnt/longhorn, not /var/lib/longhorn: it is the documented path for
      # Talos 1.10+, and it is where a UserVolumeConfig named `longhorn` would
      # mount, so moving the data to a dedicated disk later needs no change here.
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
