# Entry point for everything under apps/. Flux has no equivalent of Argo's
# directory generator, so applications are listed in apps/kustomization.yaml
# rather than discovered.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps
  prune: true
  # Long, because installing kube-prometheus-stack on these ARM cores is slow.
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Decrypts any SOPS-encrypted resource in this path. The age key lives in the
  # sops-age Secret, applied by hand: it is the one secret that can never be in
  # Git, because everything else is encrypted with it.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Storage first: on a rebuild from scratch, PVCs here need Longhorn's
  # StorageClass to already exist.
  dependsOn:
    - name: infrastructure
