# Cluster add-ons. Applications depend on this one, so a rebuild from scratch
# installs storage before anything tries to claim a volume from it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Decrypts any SOPS-encrypted resource in this path. The age key lives in the
  # sops-age Secret, applied by hand: it is the one secret that can never be in
  # Git, because everything else is encrypted with it.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
