apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rpi-fan
  namespace: rpi-fan
spec:
  selector:
    matchLabels:
      app: rpi-fan
  template:
    metadata:
      labels:
        app: rpi-fan
    spec:
      # Verified on rpi-3 and rpi-1 before widening: the fan responds and the
      # RP1 writes leave ethernet and etcd healthy. The RP1 also hosts ethernet
      # and USB, so any change to the register offsets deserves the same staged
      # rollout.
      hostPID: false
      containers:
        - name: fan-control
          image: python:3.12-slim
          command: ["python3", "/scripts/fan-control.py"]
          env:
            # Fans held at full speed. Remove this variable to go back to the
            # temperature curve.
            - name: FAN_SPEED
              value: "100"
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /host-sys
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: scripts
          configMap:
            name: rpi-fan-script
