apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rpi-fan
  namespace: rpi-fan
spec:
  selector:
    matchLabels:
      app: rpi-fan
  template:
    metadata:
      labels:
        app: rpi-fan
    spec:
      # Rolled out to one node first. Widen by removing this selector once the
      # fan is confirmed spinning and the node's network is still healthy — the
      # RP1 also hosts ethernet and USB.
      nodeSelector:
        kubernetes.io/hostname: rpi-3
      hostPID: false
      containers:
        - name: fan-control
          image: python:3.12-slim
          command: ["python3", "/scripts/fan-control.py"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /host-sys
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: scripts
          configMap:
            name: rpi-fan-script
