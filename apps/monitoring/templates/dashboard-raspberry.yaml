# Grafana's sidecar imports any ConfigMap in this namespace carrying the
# grafana_dashboard label, so a dashboard can live in Git like everything else.
#
# The JSON lives in dashboards/ rather than inline because Grafana's legend
# placeholders use the same double-brace syntax as Go templates, so Helm tries
# to evaluate them and fails. Files outside templates/ are never parsed, so
# .Files.Get sidesteps the clash. Note that Helm parses comments too: writing
# such a placeholder even in a comment here breaks the render.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-raspberry
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  raspberry.json: |
{{ .Files.Get "dashboards/raspberry.json" | indent 4 }}
