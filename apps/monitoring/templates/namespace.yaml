# node-exporter reads /proc, /sys and the host network to report CPU, memory and
# SoC temperature, so it needs hostNetwork, hostPID, hostPath volumes and a
# hostPort. Talos enforces the baseline PodSecurity profile by default, which
# rejects all four.
#
# Declared here rather than labelled by hand so the requirement travels with the
# application: a rebuild from this repository alone reproduces it.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
