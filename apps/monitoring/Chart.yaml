# Umbrella chart. Argo CD sees Chart.yaml in this directory and renders it with
# Helm, pulling the real chart as a dependency and applying values.yaml on top.
# This is what lets a Helm-based app live under the same apps/ ApplicationSet as
# plain manifest directories.
apiVersion: v2
name: monitoring
description: Prometheus, Grafana and exporters for the lab cluster
type: application
version: 0.1.0

dependencies:
  - name: kube-prometheus-stack
    version: 88.3.0
    repository: https://prometheus-community.github.io/helm-charts
