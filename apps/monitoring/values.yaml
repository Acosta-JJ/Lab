# Values are nested under the dependency name, as umbrella charts require.
kube-prometheus-stack:

  # No alert routing configured yet, and it would cost RAM plus another PVC.
  alertmanager:
    enabled: false

  # Talos renders the kube-proxy manifest at bootstrap and does not reconcile
  # extraArgs into it, so its metrics stay bound to localhost. Disabling this
  # avoids a scrape target that would fail forever and look like a real fault.
  kubeProxy:
    enabled: false

  # The chart discovers etcd through a headless Service backed by a hand-written
  # v1 Endpoints object. That resource is deprecated in Kubernetes 1.33+ and
  # Argo CD never applied it, leaving the job permanently absent. Since Talos
  # serves etcd metrics on a fixed port on every node, static targets are both
  # simpler and one moving part fewer.
  kubeEtcd:
    enabled: false

  prometheus:
    prometheusSpec:
      # 60s instead of the default 30s. Halves the samples, and therefore the
      # writes: every sample lands on an SD card twice, once per Longhorn
      # replica. Resolution is plenty for a 3-node homelab.
      scrapeInterval: 60s
      evaluationInterval: 60s

      # Deliberately short. Both limits are set because retention alone would
      # let a metrics explosion fill the volume before the 24h elapsed.
      retention: 24h
      retentionSize: 1500MB

      resources:
        requests:
          cpu: 100m
          memory: 400Mi
        limits:
          memory: 1200Mi

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

      # Talos exposes etcd metrics unauthenticated on 2381 on every control
      # plane node. etcd_disk_wal_fsync_duration_seconds is the number that says
      # whether the SD cards are hurting etcd, so this job earns its keep.
      additionalScrapeConfigs:
        - job_name: etcd
          static_configs:
            - targets:
                - 192.168.1.11:2381
                - 192.168.1.12:2381
                - 192.168.1.13:2381

  grafana:
    # Only stores dashboards and settings created through the UI; the shipped
    # dashboards come from ConfigMaps and survive without this.
    persistence:
      enabled: true
      type: pvc
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi

  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
